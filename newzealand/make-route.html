<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Neuseeland Route erzeugen</title>
</head>

<body>

<h1>Neuseeland Route erzeugen</h1>

<p>
  <button id="download">
    roadroute.geojson erzeugen
  </button>
</p>

<p id="status"></p>

<script>

/*
 * Übernachtungsorte und tatsächlich für die
 * Route verwendete Campingplätze.
 *
 * Bei mehreren Campingmöglichkeiten wird
 * momentan jeweils die erste Wahl verwendet.
 */

const stops = [

  {
    place: "Christchurch",
    camping: "Start Christchurch",
    lon: 172.6362,
    lat: -43.5321
  },

  {
    place: "Rakaia Gorge / Highbank",
    camping: "Rakaia Gorge Camp",
    lon: 171.651,
    lat: -43.519
  },

  {
    place: "Lake Tekapo",
    camping: "Lakes Edge Holiday Park",
    lon: 170.46466,
    lat: -44.00084
  },

  {
    place: "Aoraki / Mount Cook",
    camping: "DOC White Horse Hill Campground",
    lon: 170.09244,
    lat: -43.71819
  },

  {
    place: "Omarama",
    camping: "Omarama TOP 10 Holiday Park",
    lon: 169.96226,
    lat: -44.48776
  },

  {
    place: "Queenstown",
    camping: "Queenstown Holiday Park Creeksyde",
    lon: 168.66007,
    lat: -45.02553
  },

  {
    place: "Wānaka",
    camping: "Wānaka Tasman Holiday Park",
    lon: 169.10950,
    lat: -44.70514
  },

  {
    place: "Blue Pools / Cameron Flat",
    camping: "DOC Cameron Flat Campsite",
    lon: 169.28729,
    lat: -44.16122
  },

  {
    place: "Fox Glacier",
    camping: "Fox Glacier TOP 10 Holiday Park",
    lon: 170.00806,
    lat: -43.46476
  },

  {
    place: "Hokitika",
    camping: "Shining Star Beachfront Accommodation",
    lon: 170.97370,
    lat: -42.70817
  },

  {
    place: "Murchison",
    camping: "Murchison Motorhome Park",
    lon: 172.39140,
    lat: -41.75560
  },

  {
    place: "Kaiteriteri",
    camping: "Bethany Park",
    lon: 173.00522,
    lat: -41.03774
  },

  {
    place: "Havelock",
    camping: "Havelock Holiday Park",
    lon: 173.76841,
    lat: -41.27765
  },

  {
    place: "Christchurch",
    camping: "South Brighton Holiday Park",
    lon: 172.73591,
    lat: -43.53468
  }

];


/*
 * Distanzen aus deiner Reiseplanung.
 *
 * Element 0 = Stop 0 → Stop 1
 * Element 1 = Stop 1 → Stop 2
 * usw.
 */

const distances = [
   88,   // Christchurch → Rakaia
  179,   // Rakaia → Tekapo
  111,   // Tekapo → Mount Cook
   94,   // Mount Cook → Omarama
  170,   // Omarama → Queenstown
   70,   // Queenstown → Wanaka
  138,   // Wanaka → Blue Pools
  190,   // Blue Pools → Fox Glacier
  157,   // Fox Glacier → Hokitika
  236,   // Hokitika → Murchison
  138,   // Murchison → Kaiteriteri
  133,   // Kaiteriteri → Havelock
  350    // Havelock → Christchurch
];

const travelDates = [
  "08.11.2026", // Christchurch → Rakaia Gorge / Highbank
  "09.11.2026", // Rakaia Gorge / Highbank → Lake Tekapo
  "11.11.2026", // Lake Tekapo → Mount Cook
  "14.11.2026", // Mount Cook → Omarama
  "15.11.2026", // Omarama → Queenstown
  "18.11.2026", // Queenstown → Wānaka
  "21.11.2026", // Wānaka → Blue Pools / Cameron Flat
  "22.11.2026", // Blue Pools / Cameron Flat → Fox Glacier
  "24.11.2026", // Fox Glacier → Hokitika
  "26.11.2026", // Hokitika → Murchison
  "28.11.2026", // Murchison → Kaiteriteri
  "01.12.2026", // Kaiteriteri → Havelock
  "03.12.2026"  // Havelock → Christchurch
];

document
  .getElementById("download")
  .addEventListener("click", async () => {

    const status =
      document.getElementById("status");

    const features = [];

    try {

      /*
       * Jede Etappe einzeln von OSRM berechnen.
       */

      for (let i = 0; i < stops.length - 1; i++) {

        const from = stops[i];
        const to   = stops[i + 1];

        status.textContent =
          "Berechne Etappe " +
          (i + 1) +
          " von " +
          (stops.length - 1) +
          ": " +
          from.place +
          " → " +
          to.place;


        const coordinates =
          `${from.lon},${from.lat};${to.lon},${to.lat}`;


        const url =
          "https://router.project-osrm.org/route/v1/driving/" +
          coordinates +
          "?overview=full&geometries=geojson&steps=false";


        const response =
          await fetch(url);


        if (!response.ok) {

          throw new Error(
            "HTTP Fehler " +
            response.status +
            " bei " +
            from.place +
            " → " +
            to.place
          );

        }


        const data =
          await response.json();


        if (
          data.code !== "Ok" ||
          !data.routes ||
          !data.routes.length
        ) {

          throw new Error(
            "OSRM konnte keine Route berechnen: " +
            from.place +
            " → " +
            to.place
          );

        }


        /*
         * Eine GeoJSON-Feature pro Etappe.
         */

        features.push({

          type: "Feature",

          properties: {

            from: from.place,
            to: to.place,

            fromCamping: from.camping,
            toCamping: to.camping,

            date: travelDates[i],

            distance: distances[i],

            /*
             * Zusätzlich speichern wir zum Vergleich
             * die von OSRM berechnete Distanz.
             */

            osrmDistance:
              Math.round(
                data.routes[0].distance / 1000
              )

          },

          geometry:
            data.routes[0].geometry

        });


        /*
         * Öffentlichen OSRM-Server nicht mit
         * Anfragen bombardieren.
         */

        await new Promise(
          resolve => setTimeout(resolve, 500)
        );

      }


      /*
       * Alle 13 Etappen in eine GeoJSON-Datei.
       */

      const geojson = {

        type: "FeatureCollection",

        features: features

      };


      /*
       * Datei erzeugen.
       */

      const blob =
        new Blob(
          [
            JSON.stringify(
              geojson,
              null,
              2
            )
          ],
          {
            type: "application/geo+json"
          }
        );


      const downloadURL =
        URL.createObjectURL(blob);


      const link =
        document.createElement("a");

      link.href = downloadURL;

      link.download =
        "roadroute.geojson";

      link.click();


      URL.revokeObjectURL(
        downloadURL
      );


      status.textContent =
        "Fertig – 13 Etappen wurden erzeugt.";

    }

    catch (error) {

      status.textContent =
        "Fehler: " + error.message;

      console.error(error);

    }

  });

</script>

</body>

</html>
