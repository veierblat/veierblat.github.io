<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Neuseeland 2026 – Planning</title>


  <style>

    /*
     * ============================================================
     * GRUNDEINSTELLUNGEN
     * ============================================================
     */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: #f5f5f5;
      color: #222;
    }


    /*
     * ============================================================
     * KOPFBEREICH
     * ============================================================
     */

    header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1300px;
      margin: auto;
    }

    h1 {
      margin: 0 0 14px 0;
      font-size: 26px;
    }


    /*
     * Navigation Karte / Planung
     */

    .navigation {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .navigation a {
      text-decoration: none;
      color: #222;
      background: #eee;
      padding: 9px 14px;
      border-radius: 7px;
      font-weight: 600;
    }

    .navigation a.active {
      background: #333;
      color: white;
    }


    /*
     * ============================================================
     * HAUPTBEREICH
     * ============================================================
     */

    main {
      max-width: 1300px;
      margin: 25px auto;
      padding: 0 20px 50px 20px;
    }


    /*
     * ============================================================
     * WERKZEUGLEISTE
     * ============================================================
     */

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    #editButton {
      background: #333;
      color: white;
    }

    #saveButton {
      background: #2e7d32;
      color: white;
    }

    #cancelButton {
      background: #ddd;
      color: #222;
    }

    /*
     * Export der aktuellen Planung
     */
    
    #exportButton {
      background: #1565c0;
      color: white;
    }
    
      #exportButton:hover {
        background: #0d47a1;
      }
      /*
   * Website-Version laden
   */
  
  #resetButton {
    background: #eee;
    color: #333;
  }
  
  #resetButton:hover {
    background: #ddd;
  }
  
  
  /*
   * Anzeige der aktuell verwendeten Version
   */
  
  #versionInfo {
    display: flex;
    align-items: center;
    padding: 0 8px;
    font-size: 14px;
    color: #666;
  }    
    .hidden {
      display: none;
    }


    /*
     * ============================================================
     * ABSCHNITTE
     * ============================================================
     */

    .section {
      background: white;
      border-radius: 10px;
      margin-bottom: 25px;
      overflow: hidden;
      box-shadow: 0 1px 5px rgba(0,0,0,0.08);
    }

    .section-title {
      margin: 0;
      padding: 14px 18px;
      background: #ececec;
      font-size: 20px;
    }


    /*
     * ============================================================
     * TABELLE
     * ============================================================
     */

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      background: #fafafa;
      border-bottom: 2px solid #ddd;
      padding: 11px 12px;
      white-space: nowrap;
    }

    td {
      border-bottom: 1px solid #e5e5e5;
      padding: 11px 12px;
      vertical-align: top;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .date-column {
      white-space: nowrap;
      width: 150px;
    }

    .number-column {
      text-align: right;
      white-space: nowrap;
      width: 90px;
    }


    /*
     * Wohnmobil-Etappen etwas hervorheben
     */

    .motorhome-row:hover {
      background: #fafafa;
    }


    /*
     * ============================================================
     * PLANUNGSFELDER
     * ============================================================
     *
     * Jedes Reisetages-Feld besitzt immer vier mögliche
     * Einträge: item1 bis item4.
     *
     * Leere Einträge sind in der normalen Ansicht unsichtbar.
     * Im Editiermodus werden sie sichtbar.
     * ============================================================
     */

    .planning-item:empty {
      display: none;
    }


    /*
     * Im Editiermodus werden auch leere Felder angezeigt.
     */

    body.editing .planning-item {
      display: block;
      min-height: 28px;
      margin-bottom: 4px;
      padding: 4px 6px;

      background: #fffde7;

      outline: 1px dashed #c7a900;
      outline-offset: -1px;

      cursor: text;
    }


    /*
     * Letztes Planungsfeld ohne zusätzlichen Abstand.
     */

    body.editing .planning-item:last-child {
      margin-bottom: 0;
    }


    /*
     * Aktuell ausgewähltes Planungsfeld
     */

    body.editing .planning-item:focus {
      background: white;
      outline: 2px solid #777;
    }


    /*
     * ============================================================
     * SUMMENZEILE
     * ============================================================
     */

    .total-row {
      font-weight: bold;
      background: #f3f3f3;
    }


    /*
     * ============================================================
     * EDITIERMODUS FÜR TABELLENZELLEN
     * ============================================================
     */

    body.editing td[data-field] {
      background: #fffde7;
      outline: 1px dashed #c7a900;
      outline-offset: -3px;
      cursor: text;
    }

    body.editing td[data-field]:focus {
      background: white;
      outline: 2px solid #777;
    }


    /*
     * ============================================================
     * HINWEIS
     * ============================================================
     */

    #saveInfo {
      margin-bottom: 18px;
      padding: 10px 12px;
      border-radius: 7px;
      background: #e8f5e9;
      display: none;
    }

/*
 * ============================================================
 * ZEILEN HINZUFÜGEN / LÖSCHEN
 * ============================================================
 */

.row-actions {
  display: none;
}

body.editing .row-actions {
  display: table-cell;
  width: 55px;
  text-align: center;
  white-space: nowrap;
}

.delete-row {
  background: #fbe9e7;
  color: #b71c1c;
  padding: 5px 8px;
  font-size: 15px;
}

.delete-row:hover {
  background: #ffcdd2;
}

.add-row-container {
  display: none;
  padding: 10px 12px;
  border-top: 1px solid #ddd;
  background: #fafafa;
}

body.editing .add-row-container {
  display: block;
}

.add-row-button {
  background: #e8f5e9;
  color: #2e7d32;
  padding: 8px 12px;
}

.add-row-button:hover {
  background: #c8e6c9;
}

    
    /*
     * ============================================================
     * MOBILE DARSTELLUNG
     * ============================================================
     */

    @media (max-width: 700px) {

      header {
        padding: 14px;
      }

      main {
        padding: 0 10px 30px 10px;
        margin-top: 15px;
      }

      h1 {
        font-size: 22px;
      }

      .section-title {
        font-size: 18px;
      }

      th,
      td {
        padding: 9px;
        font-size: 14px;
      }

    }

  </style>

</head>


<body>

</div>

  <!-- ==========================================================
       DATEN
       ========================================================== -->

  <script src="./data/planning.js"></script>


<script>

  /*
   * ============================================================
   * LOKALE DATEN UND VERSIONSKONTROLLE
   * ============================================================
   *
   * planning.js enthält:
   *
   *   PLANNING_VERSION
   *   planning
   *
   * localStorage enthält künftig:
   *
   * {
   *   version: 1,
   *   data: [...]
   * }
   *
   * ============================================================
   */

  const STORAGE_KEY = "newzealandPlanning2026";


  /*
   * Lokale Daten aus dem Browser lesen.
   */

  let storedPlanning = null;


  try {

    storedPlanning =
      JSON.parse(
        localStorage.getItem(STORAGE_KEY)
      );

  }

  catch (error) {

    console.error(
      "Lokale Planung konnte nicht gelesen werden:",
      error
    );

  }



  /*
   * ============================================================
   * ALTES SPEICHERFORMAT ERKENNEN
   * ============================================================
   *
   * Deine bisherige planning.html hat direkt ein Array
   * gespeichert:
   *
   *   [...]
   *
   * Die neue Version speichert:
   *
   *   {
   *     version: 1,
   *     data: [...]
   *   }
   *
   * Falls noch das alte Format vorhanden ist, behandeln wir
   * es als Version 1. Dadurch gehen deine bisherigen lokalen
   * Änderungen nicht verloren.
   * ============================================================
   */

  if (Array.isArray(storedPlanning)) {

    storedPlanning = {

      version: PLANNING_VERSION,

      data: storedPlanning

    };


    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(storedPlanning)
    );

  }



  /*
   * ============================================================
   * ENTSCHEIDEN, WELCHE PLANUNG VERWENDET WIRD
   * ============================================================
   */

  let currentPlanning;

  let currentVersion;


  if (
    storedPlanning &&
    storedPlanning.data &&
    Number(storedPlanning.version) >= PLANNING_VERSION
  ) {

    /*
     * Lokale Version ist gleich neu oder neuer.
     */

    currentPlanning =
      JSON.parse(
        JSON.stringify(storedPlanning.data)
      );

    currentVersion =
      Number(storedPlanning.version);

  }

  else {

    /*
     * Website ist neuer oder es existieren
     * noch keine lokalen Daten.
     */

    currentPlanning =
      JSON.parse(
        JSON.stringify(planning)
      );

    currentVersion =
      PLANNING_VERSION;


    /*
     * Website-Version auch lokal übernehmen.
     */

    saveToLocalStorage();

  }



  /*
   * Kopie für "Abbrechen".
   */

  let planningBeforeEdit = null;



  /*
   * ============================================================
   * LOKAL SPEICHERN
   * ============================================================
   */

  function saveToLocalStorage() {

    const storageObject = {

      version: currentVersion,

      data: currentPlanning

    };


    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(storageObject)
    );

  }



  /*
   * ============================================================
   * VERSIONSANZEIGE
   * ============================================================
   */

  function updateVersionInfo() {

    const info =
      document.getElementById("versionInfo");


    info.textContent =
      `Version ${currentVersion} · Website ${PLANNING_VERSION}`;

  }



  /*
   * ============================================================
   * HTML SCHÜTZEN
   * ============================================================
   */

  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }



  /*
   * ============================================================
   * LÖSCH-BUTTON
   * ============================================================
   */

  function createDeleteButton(index) {

    return `

      <td class="row-actions">

        <button
          type="button"
          class="delete-row"
          data-delete-index="${index}"
          title="Zeile löschen"
        >
          🗑
        </button>

      </td>

    `;

  }



  /*
   * ============================================================
   * NORMALE REISETAGE
   * ============================================================
   */

  function createTravelRow(item, index) {

    let details = "";


    for (
      let itemNumber = 1;
      itemNumber <= 4;
      itemNumber++
    ) {

      const field =
        `item${itemNumber}`;

      const value =
        item[field] ?? "";


      details += `

        <div
          class="planning-item"
          data-field="${field}"
          data-index="${index}"
        >${escapeHtml(value)}</div>

      `;

    }


    return `

      <tr>

        <td
          class="date-column"
          data-field="date"
          data-index="${index}"
        >
          ${escapeHtml(item.date)}
        </td>

        <td>
          ${details}
        </td>

        ${createDeleteButton(index)}

      </tr>

    `;

  }



  /*
   * ============================================================
   * WOHNMOBIL-ETAPPEN
   * ============================================================
   */

  function createMotorhomeRow(item, index) {

    return `

      <tr class="motorhome-row">

        <td
          class="date-column"
          data-field="date"
          data-index="${index}"
        >
          ${escapeHtml(item.date)}
        </td>

        <td
          data-field="from"
          data-index="${index}"
        >
          ${escapeHtml(item.from)}
        </td>

        <td
          data-field="to"
          data-index="${index}"
        >
          ${escapeHtml(item.to)}
        </td>

        <td
          class="number-column"
          data-field="distance"
          data-index="${index}"
        >
          ${escapeHtml(item.distance)}
        </td>

        <td
          class="number-column"
          data-field="nights"
          data-index="${index}"
        >
          ${escapeHtml(item.nights)}
        </td>

        ${createDeleteButton(index)}

      </tr>

    `;

  }



  /*
   * ============================================================
   * TABELLEN AUFBAUEN
   * ============================================================
   */

  function renderPlanning() {

    const arrivalBody =
      document.getElementById("arrivalBody");

    const motorhomeBody =
      document.getElementById("motorhomeBody");

    const northIslandBody =
      document.getElementById("northIslandBody");


    arrivalBody.innerHTML = "";
    motorhomeBody.innerHTML = "";
    northIslandBody.innerHTML = "";


    const firstMotorhome =
      currentPlanning.findIndex(
        item => item.type === "motorhome"
      );


    const lastMotorhome =
      currentPlanning.findLastIndex(
        item => item.type === "motorhome"
      );


    currentPlanning.forEach((item, index) => {

      if (item.type === "motorhome") {

        motorhomeBody.insertAdjacentHTML(
          "beforeend",
          createMotorhomeRow(item, index)
        );

      }

      else if (index < firstMotorhome) {

        arrivalBody.insertAdjacentHTML(
          "beforeend",
          createTravelRow(item, index)
        );

      }

      else if (index > lastMotorhome) {

        northIslandBody.insertAdjacentHTML(
          "beforeend",
          createTravelRow(item, index)
        );

      }

    });


    updateTotals();

    activateDeleteButtons();

    updateVersionInfo();

  }



  /*
   * ============================================================
   * SUMMEN
   * ============================================================
   */

  function updateTotals() {

    let totalDistance = 0;

    let totalNights = 0;


    currentPlanning.forEach(item => {

      if (item.type === "motorhome") {

        totalDistance +=
          Number(item.distance) || 0;

        totalNights +=
          Number(item.nights) || 0;

      }

    });


    document.getElementById(
      "totalDistance"
    ).textContent =
      `${totalDistance} km`;


    document.getElementById(
      "totalNights"
    ).textContent =
      totalNights;

  }



  /*
   * ============================================================
   * EDITIERMODUS STARTEN
   * ============================================================
   */

  function startEditing() {

    planningBeforeEdit =
      JSON.parse(
        JSON.stringify(currentPlanning)
      );


    document.body.classList.add(
      "editing"
    );


    makeFieldsEditable();


    document
      .getElementById("editButton")
      .classList.add("hidden");


    document
      .getElementById("saveButton")
      .classList.remove("hidden");


    document
      .getElementById("cancelButton")
      .classList.remove("hidden");

  }



  /*
   * ============================================================
   * FELDER EDITIERBAR MACHEN
   * ============================================================
   */

  function makeFieldsEditable() {

    document
      .querySelectorAll("[data-field]")
      .forEach(element => {

        element.contentEditable =
          "true";

      });

  }



  /*
   * ============================================================
   * ÄNDERUNGEN AUSLESEN
   * ============================================================
   */

  function readChangesFromTable() {

    document
      .querySelectorAll("[data-field]")
      .forEach(element => {

        const index =
          Number(element.dataset.index);

        const field =
          element.dataset.field;

        let value =
          element.innerText.trim();


        if (
          field === "distance" ||
          field === "nights"
        ) {

          value =
            Number(
              value.replace(",", ".")
            )
            || 0;

        }


        if (currentPlanning[index]) {

          currentPlanning[index][field] =
            value;

        }

      });

  }



  /*
   * ============================================================
   * NEUE ZEILE
   * ============================================================
   */

  function addRow(section) {

    readChangesFromTable();


    if (section === "arrival") {

      const firstMotorhome =
        currentPlanning.findIndex(
          item => item.type === "motorhome"
        );


      currentPlanning.splice(

        firstMotorhome,

        0,

        {
          date: "",
          item1: "",
          item2: "",
          item3: "",
          item4: "",
          type: "travel"
        }

      );

    }


    else if (section === "motorhome") {

      const lastMotorhome =
        currentPlanning.findLastIndex(
          item => item.type === "motorhome"
        );


      currentPlanning.splice(

        lastMotorhome + 1,

        0,

        {
          date: "",
          from: "",
          to: "",
          distance: 0,
          nights: 0,
          type: "motorhome"
        }

      );

    }


    else if (section === "north") {

      currentPlanning.push({

        date: "",
        item1: "",
        item2: "",
        item3: "",
        item4: "",
        type: "travel"

      });

    }


    renderPlanning();

    makeFieldsEditable();

  }



  /*
   * ============================================================
   * ZEILE LÖSCHEN
   * ============================================================
   */

  function deleteRow(index) {

    readChangesFromTable();


    currentPlanning.splice(
      index,
      1
    );


    renderPlanning();

    makeFieldsEditable();

  }



  /*
   * ============================================================
   * LÖSCH-BUTTONS
   * ============================================================
   */

  function activateDeleteButtons() {

    document
      .querySelectorAll(
        "[data-delete-index]"
      )
      .forEach(button => {

        button.addEventListener(
          "click",
          function() {

            const index =
              Number(
                this.dataset.deleteIndex
              );


            const confirmed =
              confirm(
                "Dës Zeil wierklech läschen?"
              );


            if (confirmed) {

              deleteRow(index);

            }

          }
        );

      });

  }



  /*
   * ============================================================
   * SPEICHERN
   * ============================================================
   */

  function savePlanning() {

    readChangesFromTable();


    /*
     * Die Versionsnummer wird beim normalen
     * lokalen Speichern NICHT erhöht.
     */

    saveToLocalStorage();


    finishEditing();

    renderPlanning();


    const saveInfo =
      document.getElementById("saveInfo");


    saveInfo.style.display =
      "block";


    setTimeout(() => {

      saveInfo.style.display =
        "none";

    }, 3000);

  }



  /*
   * ============================================================
   * ABBRECHEN
   * ============================================================
   */

  function cancelEditing() {

    if (planningBeforeEdit) {

      currentPlanning =
        JSON.parse(
          JSON.stringify(planningBeforeEdit)
        );

    }


    finishEditing();

    renderPlanning();

  }



  /*
   * ============================================================
   * EDITIERMODUS BEENDEN
   * ============================================================
   */

  function finishEditing() {

    document.body.classList.remove(
      "editing"
    );


    document
      .querySelectorAll("[data-field]")
      .forEach(element => {

        element.contentEditable =
          "false";

      });


    document
      .getElementById("editButton")
      .classList.remove("hidden");


    document
      .getElementById("saveButton")
      .classList.add("hidden");


    document
      .getElementById("cancelButton")
      .classList.add("hidden");

  }



  /*
   * ============================================================
   * PLANNING.JS EXPORTIEREN
   * ============================================================
   *
   * Beim Export wird automatisch eine neue Versionsnummer
   * erzeugt.
   *
   * Beispiel:
   *
   * Website Version 1
   *       ↓
   * Export Version 2
   *
   * Nach dem Hochladen nach GitHub ist die Website
   * anschließend Version 2.
   * ============================================================
   */

  function exportPlanning() {

    if (
      document.body.classList.contains(
        "editing"
      )
    ) {

      readChangesFromTable();

    }


    /*
     * Neue Version bestimmen.
     */

    const exportVersion =
      Math.max(
        currentVersion,
        PLANNING_VERSION
      ) + 1;


    /*
     * Inhalt der neuen planning.js
     */

    const fileContent =

`/*
 * ============================================================
 * NEUSEELAND 2026 – REISEPLANUNG
 * ============================================================
 *
 * Diese Datei wurde aus planning.html exportiert.
 *
 * Version ${exportVersion}
 *
 * ============================================================
 */

const PLANNING_VERSION = ${exportVersion};

const planning = ${JSON.stringify(
  currentPlanning,
  null,
  2
)};
`;


    /*
     * Download-Datei erzeugen.
     */

    const blob =
      new Blob(
        [fileContent],
        {
          type:
            "text/javascript;charset=utf-8"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");


    link.href = url;

    link.download =
      "planning.js";


    document.body.appendChild(link);

    link.click();

    link.remove();


    URL.revokeObjectURL(url);


    /*
     * Auch die lokale Arbeitskopie bekommt jetzt
     * diese Versionsnummer.
     */

    currentVersion =
      exportVersion;


    saveToLocalStorage();

    updateVersionInfo();

  }



  /*
   * ============================================================
   * WEBSITE-VERSION LADEN
   * ============================================================
   *
   * Löscht bewusst die lokale Arbeitskopie und lädt
   * den Stand aus planning.js.
   * ============================================================
   */

  function loadWebsiteVersion() {

    const confirmed =
      confirm(
        "Lokal Ännerunge verwerfen an d'Website-Version lueden?"
      );


    if (!confirmed) {

      return;

    }


    currentPlanning =
      JSON.parse(
        JSON.stringify(planning)
      );


    currentVersion =
      PLANNING_VERSION;


    saveToLocalStorage();

    finishEditing();

    renderPlanning();

  }



  /*
   * ============================================================
   * BUTTONS
   * ============================================================
   */

  document
    .getElementById("editButton")
    .addEventListener(
      "click",
      startEditing
    );


  document
    .getElementById("saveButton")
    .addEventListener(
      "click",
      savePlanning
    );


  document
    .getElementById("cancelButton")
    .addEventListener(
      "click",
      cancelEditing
    );


  /*
   * Export wird jetzt EINMAL hier aktiviert.
   *
   * Damit ist auch der Fehler der bisherigen Version behoben.
   */

  document
    .getElementById("exportButton")
    .addEventListener(
      "click",
      exportPlanning
    );


  document
    .getElementById("resetButton")
    .addEventListener(
      "click",
      loadWebsiteVersion
    );



  /*
   * ============================================================
   * HINZUFÜGEN-BUTTONS
   * ============================================================
   */

  document
    .querySelectorAll(
      "[data-add-section]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        function() {

          addRow(
            this.dataset.addSection
          );

        }
      );

    });



  /*
   * ============================================================
   * START
   * ============================================================
   */

  renderPlanning();

</script>


</body>

</html>
