<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Neuseeland 2026 – Reiseplanung</title>


  <style>

    /*
     * ============================================================
     * GRUNDEINSTELLUNGEN
     * ============================================================
     */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: #f5f5f5;
      color: #222;
    }


    /*
     * ============================================================
     * KOPFBEREICH
     * ============================================================
     */

    header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1300px;
      margin: auto;
    }

    h1 {
      margin: 0 0 14px 0;
      font-size: 26px;
    }


    /*
     * Navigation Karte / Planung
     */

    .navigation {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .navigation a {
      text-decoration: none;
      color: #222;
      background: #eee;
      padding: 9px 14px;
      border-radius: 7px;
      font-weight: 600;
    }

    .navigation a.active {
      background: #333;
      color: white;
    }


    /*
     * ============================================================
     * HAUPTBEREICH
     * ============================================================
     */

    main {
      max-width: 1300px;
      margin: 25px auto;
      padding: 0 20px 50px 20px;
    }


    /*
     * ============================================================
     * WERKZEUGLEISTE
     * ============================================================
     */

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    #editButton {
      background: #333;
      color: white;
    }

    #saveButton {
      background: #2e7d32;
      color: white;
    }

    #cancelButton {
      background: #ddd;
      color: #222;
    }

    .hidden {
      display: none;
    }


    /*
     * ============================================================
     * ABSCHNITTE
     * ============================================================
     */

    .section {
      background: white;
      border-radius: 10px;
      margin-bottom: 25px;
      overflow: hidden;
      box-shadow: 0 1px 5px rgba(0,0,0,0.08);
    }

    .section-title {
      margin: 0;
      padding: 14px 18px;
      background: #ececec;
      font-size: 20px;
    }


    /*
     * ============================================================
     * TABELLE
     * ============================================================
     */

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      background: #fafafa;
      border-bottom: 2px solid #ddd;
      padding: 11px 12px;
      white-space: nowrap;
    }

    td {
      border-bottom: 1px solid #e5e5e5;
      padding: 11px 12px;
      vertical-align: top;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .date-column {
      white-space: nowrap;
      width: 150px;
    }

    .number-column {
      text-align: right;
      white-space: nowrap;
      width: 90px;
    }


    /*
     * Wohnmobil-Etappen etwas hervorheben
     */

    .motorhome-row:hover {
      background: #fafafa;
    }


    /*
     * ============================================================
     * PLANUNGSFELDER
     * ============================================================
     *
     * Jedes Reisetages-Feld besitzt immer vier mögliche
     * Einträge: item1 bis item4.
     *
     * Leere Einträge sind in der normalen Ansicht unsichtbar.
     * Im Editiermodus werden sie sichtbar.
     * ============================================================
     */

    .planning-item:empty {
      display: none;
    }


    /*
     * Im Editiermodus werden auch leere Felder angezeigt.
     */

    body.editing .planning-item {
      display: block;
      min-height: 28px;
      margin-bottom: 4px;
      padding: 4px 6px;

      background: #fffde7;

      outline: 1px dashed #c7a900;
      outline-offset: -1px;

      cursor: text;
    }


    /*
     * Letztes Planungsfeld ohne zusätzlichen Abstand.
     */

    body.editing .planning-item:last-child {
      margin-bottom: 0;
    }


    /*
     * Aktuell ausgewähltes Planungsfeld
     */

    body.editing .planning-item:focus {
      background: white;
      outline: 2px solid #777;
    }


    /*
     * ============================================================
     * SUMMENZEILE
     * ============================================================
     */

    .total-row {
      font-weight: bold;
      background: #f3f3f3;
    }


    /*
     * ============================================================
     * EDITIERMODUS FÜR TABELLENZELLEN
     * ============================================================
     */

    body.editing td[data-field] {
      background: #fffde7;
      outline: 1px dashed #c7a900;
      outline-offset: -3px;
      cursor: text;
    }

    body.editing td[data-field]:focus {
      background: white;
      outline: 2px solid #777;
    }


    /*
     * ============================================================
     * HINWEIS
     * ============================================================
     */

    #saveInfo {
      margin-bottom: 18px;
      padding: 10px 12px;
      border-radius: 7px;
      background: #e8f5e9;
      display: none;
    }

/*
 * ============================================================
 * ZEILEN HINZUFÜGEN / LÖSCHEN
 * ============================================================
 */

.row-actions {
  display: none;
}

body.editing .row-actions {
  display: table-cell;
  width: 55px;
  text-align: center;
  white-space: nowrap;
}

.delete-row {
  background: #fbe9e7;
  color: #b71c1c;
  padding: 5px 8px;
  font-size: 15px;
}

.delete-row:hover {
  background: #ffcdd2;
}

.add-row-container {
  display: none;
  padding: 10px 12px;
  border-top: 1px solid #ddd;
  background: #fafafa;
}

body.editing .add-row-container {
  display: block;
}

.add-row-button {
  background: #e8f5e9;
  color: #2e7d32;
  padding: 8px 12px;
}

.add-row-button:hover {
  background: #c8e6c9;
}

    
    /*
     * ============================================================
     * MOBILE DARSTELLUNG
     * ============================================================
     */

    @media (max-width: 700px) {

      header {
        padding: 14px;
      }

      main {
        padding: 0 10px 30px 10px;
        margin-top: 15px;
      }

      h1 {
        font-size: 22px;
      }

      .section-title {
        font-size: 18px;
      }

      th,
      td {
        padding: 9px;
        font-size: 14px;
      }

    }

  </style>

</head>


<body>


  <!-- ==========================================================
       KOPFBEREICH
       ========================================================== -->

  <header>

    <div class="header-inner">

      <h1>🇳🇿 Neuseeland 2026</h1>

      <div class="navigation">

        <a href="./index.html">
          🗺 Karte
        </a>

        <a
          href="./planning.html"
          class="active"
        >
          📋 Reiseplanung
        </a>

      </div>

    </div>

  </header>



  <!-- ==========================================================
       HAUPTBEREICH
       ========================================================== -->

  <main>


    <!-- Werkzeugleiste -->

    <div class="toolbar">

      <button
        id="editButton"
        type="button"
      >
        ✏️ Edit
      </button>

      <button
        id="saveButton"
        class="hidden"
        type="button"
      >
        ✓ Speichern
      </button>

      <button
        id="cancelButton"
        class="hidden"
        type="button"
      >
        Abbrechen
      </button>

    </div>


    <div id="saveInfo">
      ✓ Änderungen wurden auf diesem Gerät gespeichert.
    </div>



    <!-- ========================================================
         ANREISE
         ======================================================== -->

   <section class="section">

  <h2 class="section-title">
    ✈️ Anreise
  </h2>

  <div class="table-wrapper">

    <table>

      <thead>
        <tr>
          <th>Datum</th>
          <th>Planung</th>
        </tr>
      </thead>

      <tbody id="arrivalBody">
      </tbody>

    </table>

  </div>


  <!-- Nur im Editiermodus sichtbar -->

  <div class="add-row-container">

    <button
      class="add-row-button"
      type="button"
      data-add-section="arrival"
    >
      ＋ Tag hinzufügen
    </button>

  </div>

</section>


<!-- ========================================================
     WOHNMOBIL
     ======================================================== -->

<section class="section">

  <h2 class="section-title">
    🚐 WoMo – Südinsel
  </h2>

  <div class="table-wrapper">

    <table>

      <thead>

        <tr>
          <th>Datum</th>
          <th>Vun</th>
          <th>Bis</th>
          <th class="number-column">km</th>
          <th class="number-column">Nuechten</th>
        </tr>

      </thead>


      <tbody id="motorhomeBody">
      </tbody>


      <tfoot>

        <tr class="total-row">

          <td colspan="3">
            Total
          </td>

          <td
            id="totalDistance"
            class="number-column"
          >
          </td>

          <td
            id="totalNights"
            class="number-column"
          >
          </td>

        </tr>

      </tfoot>

    </table>

  </div>


  <!-- Nur im Editiermodus sichtbar -->

  <div class="add-row-container">

    <button
      class="add-row-button"
      type="button"
      data-add-section="motorhome"
    >
      ＋ Etapp dobäi maachen
    </button>

  </div>

</section>

<!-- ========================================================
     NORDINSEL
     ======================================================== -->

<section class="section">

  <h2 class="section-title">
    🏝 Nordinsel & Flug op Lëtzebuerg
  </h2>

  <div class="table-wrapper">

    <table>

      <thead>
        <tr>
          <th>Datum</th>
          <th>Planung</th>
        </tr>
      </thead>

      <tbody id="northIslandBody">
      </tbody>

    </table>

  </div>


  <!-- Nur im Editiermodus sichtbar -->

  <div class="add-row-container">

    <button
      class="add-row-button"
      type="button"
      data-add-section="north"
    >
      ＋ Dag dobäi maachen
    </button>

  </div>

</section>


  </main>



  <!-- ==========================================================
       DATEN
       ========================================================== -->

  <script src="./data/planning.js"></script>


<script>

  /*
   * ============================================================
   * LOKALE DATEN
   * ============================================================
   */

  const STORAGE_KEY = "newzealandPlanning2026";


  /*
   * Falls bereits Änderungen im Browser gespeichert wurden,
   * verwenden wir diese.
   *
   * Ansonsten werden die Originaldaten aus planning.js benutzt.
   */

  let currentPlanning =
    JSON.parse(localStorage.getItem(STORAGE_KEY))
    ||
    JSON.parse(JSON.stringify(planning));


  /*
   * Kopie für die Funktion "Abbrechen".
   */

  let planningBeforeEdit = null;



  /*
   * ============================================================
   * HILFSFUNKTION
   * ============================================================
   */

  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }



  /*
   * ============================================================
   * LÖSCH-BUTTON
   * ============================================================
   */

  function createDeleteButton(index) {

    return `

      <td class="row-actions">

        <button
          type="button"
          class="delete-row"
          data-delete-index="${index}"
          title="Zeile löschen"
        >
          🗑
        </button>

      </td>

    `;

  }



  /*
   * ============================================================
   * NORMALE REISETAGE
   * ============================================================
   *
   * Für Anreise und Nordinsel werden immer vier
   * Planungsfelder erzeugt.
   *
   * Dadurch können auch leere Felder bearbeitet werden.
   * ============================================================
   */

  function createTravelRow(item, index) {

    let details = "";


    for (
      let itemNumber = 1;
      itemNumber <= 4;
      itemNumber++
    ) {

      const field =
        `item${itemNumber}`;

      const value =
        item[field] ?? "";


      details += `

        <div
          class="planning-item"
          data-field="${field}"
          data-index="${index}"
        >${escapeHtml(value)}</div>

      `;

    }


    return `

      <tr>

        <td
          class="date-column"
          data-field="date"
          data-index="${index}"
        >
          ${escapeHtml(item.date)}
        </td>

        <td>
          ${details}
        </td>

        ${createDeleteButton(index)}

      </tr>

    `;

  }



  /*
   * ============================================================
   * WOHNMOBIL-ETAPPEN
   * ============================================================
   */

  function createMotorhomeRow(item, index) {

    return `

      <tr class="motorhome-row">

        <td
          class="date-column"
          data-field="date"
          data-index="${index}"
        >
          ${escapeHtml(item.date)}
        </td>

        <td
          data-field="from"
          data-index="${index}"
        >
          ${escapeHtml(item.from)}
        </td>

        <td
          data-field="to"
          data-index="${index}"
        >
          ${escapeHtml(item.to)}
        </td>

        <td
          class="number-column"
          data-field="distance"
          data-index="${index}"
        >
          ${escapeHtml(item.distance)}
        </td>

        <td
          class="number-column"
          data-field="nights"
          data-index="${index}"
        >
          ${escapeHtml(item.nights)}
        </td>

        ${createDeleteButton(index)}

      </tr>

    `;

  }



  /*
   * ============================================================
   * TABELLEN AUFBAUEN
   * ============================================================
   */

  function renderPlanning() {

    const arrivalBody =
      document.getElementById("arrivalBody");

    const motorhomeBody =
      document.getElementById("motorhomeBody");

    const northIslandBody =
      document.getElementById("northIslandBody");


    /*
     * Tabellen zunächst leeren.
     */

    arrivalBody.innerHTML = "";
    motorhomeBody.innerHTML = "";
    northIslandBody.innerHTML = "";


    /*
     * Erste und letzte Wohnmobil-Etappe suchen.
     *
     * Alles davor gehört zur Anreise.
     * Alles danach gehört zur Nordinsel/Rückreise.
     */

    const firstMotorhome =
      currentPlanning.findIndex(
        item => item.type === "motorhome"
      );

    const lastMotorhome =
      currentPlanning.findLastIndex(
        item => item.type === "motorhome"
      );


    /*
     * Alle Daten in die passende Tabelle eintragen.
     */

    currentPlanning.forEach((item, index) => {

      if (item.type === "motorhome") {

        motorhomeBody.insertAdjacentHTML(
          "beforeend",
          createMotorhomeRow(item, index)
        );

      }

      else if (index < firstMotorhome) {

        arrivalBody.insertAdjacentHTML(
          "beforeend",
          createTravelRow(item, index)
        );

      }

      else if (index > lastMotorhome) {

        northIslandBody.insertAdjacentHTML(
          "beforeend",
          createTravelRow(item, index)
        );

      }

    });


    updateTotals();

    activateDeleteButtons();

  }



  /*
   * ============================================================
   * SUMMEN BERECHNEN
   * ============================================================
   */

  function updateTotals() {

    let totalDistance = 0;
    let totalNights = 0;


    currentPlanning.forEach(item => {

      if (item.type === "motorhome") {

        totalDistance +=
          Number(item.distance) || 0;

        totalNights +=
          Number(item.nights) || 0;

      }

    });


    document.getElementById(
      "totalDistance"
    ).textContent =
      `${totalDistance} km`;


    document.getElementById(
      "totalNights"
    ).textContent =
      totalNights;

  }



  /*
   * ============================================================
   * EDITIERMODUS STARTEN
   * ============================================================
   */

  function startEditing() {

    /*
     * Zustand vor dem Editieren sichern.
     *
     * Dadurch können wir bei "Abbrechen" alles wiederherstellen,
     * auch gelöschte oder neu hinzugefügte Zeilen.
     */

    planningBeforeEdit =
      JSON.parse(
        JSON.stringify(currentPlanning)
      );


    document.body.classList.add("editing");


    /*
     * Felder editierbar machen.
     */

    makeFieldsEditable();


    /*
     * Buttons umschalten.
     */

    document
      .getElementById("editButton")
      .classList.add("hidden");

    document
      .getElementById("saveButton")
      .classList.remove("hidden");

    document
      .getElementById("cancelButton")
      .classList.remove("hidden");

  }



  /*
   * ============================================================
   * FELDER EDITIERBAR MACHEN
   * ============================================================
   */

  function makeFieldsEditable() {

    document
      .querySelectorAll("[data-field]")
      .forEach(element => {

        element.contentEditable = "true";

      });

  }



  /*
   * ============================================================
   * ÄNDERUNGEN AUS DER TABELLE AUSLESEN
   * ============================================================
   */

  function readChangesFromTable() {

    document
      .querySelectorAll("[data-field]")
      .forEach(element => {

        const index =
          Number(element.dataset.index);

        const field =
          element.dataset.field;

        let value =
          element.innerText.trim();


        /*
         * km und Nächte als Zahlen speichern.
         */

        if (
          field === "distance" ||
          field === "nights"
        ) {

          value =
            Number(value.replace(",", "."))
            || 0;

        }


        /*
         * Prüfen, ob die Zeile noch existiert.
         */

        if (currentPlanning[index]) {

          currentPlanning[index][field] =
            value;

        }

      });

  }



  /*
   * ============================================================
   * NEUE ZEILE HINZUFÜGEN
   * ============================================================
   */

  function addRow(section) {

    /*
     * Bereits gemachte Änderungen zuerst übernehmen.
     *
     * Das ist wichtig, weil anschließend die Tabelle
     * neu aufgebaut wird.
     */

    readChangesFromTable();


    /*
     * ----------------------------------------------------------
     * ANREISE
     * ----------------------------------------------------------
     */

    if (section === "arrival") {

      const firstMotorhome =
        currentPlanning.findIndex(
          item => item.type === "motorhome"
        );


      const newItem = {

        date: "",

        item1: "",
        item2: "",
        item3: "",
        item4: "",

        type: "travel"

      };


      /*
       * Neue Zeile direkt vor der ersten
       * Wohnmobil-Etappe einfügen.
       */

      currentPlanning.splice(
        firstMotorhome,
        0,
        newItem
      );

    }


    /*
     * ----------------------------------------------------------
     * WOHNMOBIL
     * ----------------------------------------------------------
     */

    else if (section === "motorhome") {

      const lastMotorhome =
        currentPlanning.findLastIndex(
          item => item.type === "motorhome"
        );


      const newItem = {

        date: "",

        from: "",
        to: "",

        distance: 0,
        nights: 0,

        type: "motorhome"

      };


      /*
       * Neue Etappe nach der letzten
       * Wohnmobil-Etappe einfügen.
       */

      currentPlanning.splice(
        lastMotorhome + 1,
        0,
        newItem
      );

    }


    /*
     * ----------------------------------------------------------
     * NORDINSEL / RÜCKREISE
     * ----------------------------------------------------------
     */

    else if (section === "north") {

      const newItem = {

        date: "",

        item1: "",
        item2: "",
        item3: "",
        item4: "",

        type: "travel"

      };


      /*
       * Neue Zeile ans Ende setzen.
       */

      currentPlanning.push(
        newItem
      );

    }


    /*
     * Tabellen neu aufbauen.
     */

    renderPlanning();


    /*
     * Wir befinden uns weiterhin im Editiermodus.
     * Deshalb die neuen Felder ebenfalls editierbar machen.
     */

    makeFieldsEditable();

  }



  /*
   * ============================================================
   * ZEILE LÖSCHEN
   * ============================================================
   */

  function deleteRow(index) {

    /*
     * Noch nicht gespeicherte Änderungen zuerst übernehmen.
     */

    readChangesFromTable();


    /*
     * Zeile aus den Daten entfernen.
     */

    currentPlanning.splice(
      index,
      1
    );


    /*
     * Tabellen neu aufbauen.
     */

    renderPlanning();


    /*
     * Editiermodus beibehalten.
     */

    makeFieldsEditable();

  }



  /*
   * ============================================================
   * PAPIERKORB-BUTTONS AKTIVIEREN
   * ============================================================
   */

  function activateDeleteButtons() {

    document
      .querySelectorAll("[data-delete-index]")
      .forEach(button => {

        button.addEventListener(
          "click",
          function() {

            const index =
              Number(
                this.dataset.deleteIndex
              );


            /*
             * Vor dem Löschen nachfragen.
             */

            const confirmed =
              confirm(
                "Dës Zeil wierklech läschen?"
              );


            if (confirmed) {

              deleteRow(index);

            }

          }
        );

      });

  }



  /*
   * ============================================================
   * SPEICHERN
   * ============================================================
   */

  function savePlanning() {

    /*
     * Aktuelle Eingaben auslesen.
     */

    readChangesFromTable();


    /*
     * Im Browser speichern.
     */

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(currentPlanning)
    );


    finishEditing();

    renderPlanning();


    /*
     * Speicherbestätigung anzeigen.
     */

    const saveInfo =
      document.getElementById("saveInfo");


    saveInfo.style.display =
      "block";


    setTimeout(() => {

      saveInfo.style.display =
        "none";

    }, 3000);

  }



  /*
   * ============================================================
   * ABBRECHEN
   * ============================================================
   */

  function cancelEditing() {

    /*
     * Zustand vor dem Editieren wiederherstellen.
     */

    if (planningBeforeEdit) {

      currentPlanning =
        JSON.parse(
          JSON.stringify(planningBeforeEdit)
        );

    }


    finishEditing();

    renderPlanning();

  }



  /*
   * ============================================================
   * EDITIERMODUS BEENDEN
   * ============================================================
   */

  function finishEditing() {

    document.body.classList.remove(
      "editing"
    );


    document
      .querySelectorAll("[data-field]")
      .forEach(element => {

        element.contentEditable =
          "false";

      });


    /*
     * Buttons wieder auf Normalzustand setzen.
     */

    document
      .getElementById("editButton")
      .classList.remove("hidden");

    document
      .getElementById("saveButton")
      .classList.add("hidden");

    document
      .getElementById("cancelButton")
      .classList.add("hidden");

  }



  /*
   * ============================================================
   * HAUPT-BUTTONS
   * ============================================================
   */

  document
    .getElementById("editButton")
    .addEventListener(
      "click",
      startEditing
    );


  document
    .getElementById("saveButton")
    .addEventListener(
      "click",
      savePlanning
    );


  document
    .getElementById("cancelButton")
    .addEventListener(
      "click",
      cancelEditing
    );



  /*
   * ============================================================
   * HINZUFÜGEN-BUTTONS
   * ============================================================
   */

  document
    .querySelectorAll("[data-add-section]")
    .forEach(button => {

      button.addEventListener(
        "click",
        function() {

          addRow(
            this.dataset.addSection
          );

        }
      );

    });



  /*
   * ============================================================
   * START
   * ============================================================
   */

  renderPlanning();

</script>


</body>

</html>
