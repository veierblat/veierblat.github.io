<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Neuseeland 2026</title>

  <link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #title {
      position: absolute;
      top: 10px;
      left: 55px;
      z-index: 1000;

      background: white;
      padding: 8px 14px;
      border-radius: 6px;

      font-size: 18px;
      font-weight: bold;

      box-shadow: 0 1px 5px rgba(0,0,0,0.35);
    }
  </style>
</head>

<body>

<div id="map"></div>
<div id="title">Neuseeland 2026</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./data/route.js"></script>
<script src="./data/campings.js"></script>

<script>
  const map = L.map("map");

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);


  const routeCoordinates = [];


  tripStops.forEach((stop, index) => {

    routeCoordinates.push([stop.lat, stop.lon]);

    let popup = `
      <div style="font-size:16px;font-weight:bold;margin-bottom:6px;">
        ${index + 1}. ${stop.name}
      </div>

      <div>
        ${stop.date}
        ${
          stop.nights > 0
          ? `<br><b>${stop.nights} Nacht${stop.nights === 1 ? "" : "e"}</b>`
          : ""
        }
      </div>
    `;


    if (stop.camping) {
      popup += `
        <div style="margin-top:10px;">
          <b>Camping</b><br>
          ${stop.camping}
        </div>
      `;
    }


    if (stop.notes) {
      popup += `
        <div style="margin-top:10px;">
          <b>Programm / Bemerkungen</b><br>
          ${stop.notes}
        </div>
      `;
    }


    L.marker([stop.lat, stop.lon])
      .addTo(map)
      .bindPopup(popup, { maxWidth: 350 });

  });

const campingIcon = L.divIcon({
  className: "",
  html: `
    <div style="
      background:#238636;
      width:30px;
      height:30px;
      border-radius:50%;
      border:2px solid white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:17px;
      box-shadow:0 1px 5px rgba(0,0,0,0.5);
    ">
      ⛺
    </div>
  `,
  iconSize: [30, 30],
  iconAnchor: [15, 15],
  popupAnchor: [0, -15]
});


campings.forEach(camp => {

  const popup = `
    <div style="
      font-size:16px;
      font-weight:bold;
      margin-bottom:6px;
    ">
      ⛺ ${camp.name}
    </div>

    <div>
      ${camp.date}
    </div>

    <div style="margin-top:8px;">
      <b>Ausstattung</b><br>
      ${camp.facilities}
    </div>

    ${
      camp.note
      ? `
        <div style="margin-top:8px;">
          <b>Bemerkung</b><br>
          ${camp.note}
        </div>
      `
      : ""
    }
  `;


  L.marker(
    [camp.lat, camp.lon],
    {
      icon: campingIcon
    }
  )
  .addTo(map)
  .bindPopup(
    popup,
    {
      maxWidth: 320
    }
  );

});
  
fetch("./data/roadroute.geojson")
  .then(response => response.json())
  .then(data => {

    function formatTime(minutes) {
      const hours = Math.floor(minutes / 60);
      const mins = minutes % 60;

      return `${hours} h ${String(mins).padStart(2, "0")} min`;
    }


    const roadRoute = L.geoJSON(data, {

      style: {
        weight: 5,
        opacity: 0.8
      },

      onEachFeature: function(feature, layer) {

        const p = feature.properties;

        const distance = p.distance;

        // Fahrzeit bei durchschnittlich 50 km/h
        const drivingMinutes =
          Math.round(distance / 50 * 60);

        // 15 Minuten Pause pro Fahrstunde
        const rawBreakMinutes =
          drivingMinutes / 4;

        // Pausen auf die nächsten 15 Minuten aufrunden
        const breakMinutes =
          Math.ceil(rawBreakMinutes / 15) * 15;

        const totalMinutes =
          drivingMinutes + breakMinutes;


        const popup = `

          <div style="
            font-size:17px;
            font-weight:bold;
            margin-bottom:8px;
          ">
            ${p.from} → ${p.to}
          </div>

          <div style="margin-bottom:8px;">
            ${p.fromCamping}<br>
            ↓<br>
            ${p.toCamping}
          </div>

          <div>
            Distanz:
            <b>${distance} km</b>
          </div>

          <div>
            Fahrzeit bei 50 km/h:
            <b>${formatTime(drivingMinutes)}</b>
          </div>

          <div>
            Pausen:
            <b>${formatTime(breakMinutes)}</b>
          </div>

          <div style="
            margin-top:6px;
            padding-top:6px;
            border-top:1px solid #aaa;
          ">
            Total:
            <b>${formatTime(totalMinutes)}</b>
          </div>

        `;


        layer.bindPopup(popup, {
          maxWidth: 350
        });


        // Beim Darüberfahren Route hervorheben

        layer.on("mouseover", function() {
          this.setStyle({
            weight: 9
          });
        });

        layer.on("mouseout", function() {
          this.setStyle({
            weight: 5
          });
        });

      }

    }).addTo(map);


    map.fitBounds(
      roadRoute.getBounds(),
      {
        padding: [30, 30]
      }
    );

  })
  .catch(error => {
    console.error(
      "Fehler beim Laden der Straßenroute:",
      error
    );
  });


  map.fitBounds(
    routeLine.getBounds(),
    {
      padding: [30, 30]
    }
  );
</script>

</body>
</html>
