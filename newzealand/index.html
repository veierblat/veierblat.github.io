<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Neuseeland 2026</title>

  <link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #title {
      position: absolute;
      top: 10px;
      left: 55px;
      z-index: 1000;

      background: white;
      padding: 8px 14px;
      border-radius: 6px;

      font-size: 18px;
      font-weight: bold;

      box-shadow: 0 1px 5px rgba(0,0,0,0.35);
    }
  </style>
</head>

<body>

<div id="map"></div>
<div id="title">Neuseeland 2026</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="./data/route.js"></script>

<script>
  const map = L.map("map");

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);


  const routeCoordinates = [];


  tripStops.forEach((stop, index) => {

    routeCoordinates.push([stop.lat, stop.lon]);

    let popup = `
      <div style="font-size:16px;font-weight:bold;margin-bottom:6px;">
        ${index + 1}. ${stop.name}
      </div>

      <div>
        ${stop.date}
        ${
          stop.nights > 0
          ? `<br><b>${stop.nights} Nacht${stop.nights === 1 ? "" : "e"}</b>`
          : ""
        }
      </div>
    `;


    if (stop.camping) {
      popup += `
        <div style="margin-top:10px;">
          <b>Camping</b><br>
          ${stop.camping}
        </div>
      `;
    }


    if (stop.notes) {
      popup += `
        <div style="margin-top:10px;">
          <b>Programm / Bemerkungen</b><br>
          ${stop.notes}
        </div>
      `;
    }


    L.marker([stop.lat, stop.lon])
      .addTo(map)
      .bindPopup(popup, { maxWidth: 350 });

  });


fetch("./data/roadroute.geojson")
  .then(response => response.json())
  .then(data => {
    const roadRoute = L.geoJSON(data, {
      style: {
        weight: 4,
        opacity: 0.8
      }
    }).addTo(map);

    map.fitBounds(roadRoute.getBounds(), {
      padding: [30, 30]
    });
  });


  map.fitBounds(
    routeLine.getBounds(),
    {
      padding: [30, 30]
    }
  );
</script>

</body>
</html>
