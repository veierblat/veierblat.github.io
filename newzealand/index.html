<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Neuseeland 2026</title>


  <!--
  ============================================================
  LEAFLET CSS
  ============================================================
  -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >


  <!--
  ============================================================
  SEITENLAYOUT
  ============================================================
  -->

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }


    body {
      font-family: Arial, Helvetica, sans-serif;
    }


    /*
     * Karte über das gesamte Browserfenster
     */

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }


 /*
 * ============================================================
 * TITEL UND NAVIGATION
 * ============================================================
 *
 * Die Leiste liegt über der Karte.
 * Titel und beide Buttons haben dieselbe Höhe.
 * ============================================================
 */

    #topbar {
      position: absolute;
    
      top: 10px;
      left: 55px;
    
      z-index: 1000;
    
      display: flex;
      align-items: center;
    
      gap: 12px;
    }
    
    
    /*
     * ============================================================
     * GEMEINSAME DARSTELLUNG
     * ============================================================
     *
     * Titel und Navigationsbuttons bekommen dieselbe Höhe.
     * ============================================================
     */
    
    #title,
    .topbarButton {
      height: 46px;
    
      box-sizing: border-box;
    
      display: flex;
      align-items: center;
    
      padding: 8px 14px;
    
      background: white;
    
      border-radius: 6px;
    
      font-weight: bold;
    
      box-shadow:
        0 1px 5px rgba(0,0,0,0.35);
    
      white-space: nowrap;
    }
    
    
    /*
     * Titel etwas größer
     */
    
    #title {
      font-size: 18px;
    }
    
    
    /*
     * Navigationsbuttons
     */
    
    .topbarButton {
      color: #222;
    
      font-size: 16px;
    
      text-decoration: none;
    }
    
    
    /*
     * Maus über einem Button
     */
    
    .topbarButton:hover {
      background: #f0f0f0;
    }
    
    
    /*
     * ============================================================
     * KLEINE BILDSCHIRME
     * ============================================================
     */
    
    @media (max-width: 600px) {
    
      #topbar {
        gap: 6px;
      }
    
    
      #title,
      .topbarButton {
        height: 40px;
    
        padding: 7px 9px;
      }
    
    
      #title {
        font-size: 14px;
      }
    
    
      .topbarButton {
        font-size: 14px;
      }
    
    }              

  </style>

</head>



<body>


<!--
============================================================
KARTE
============================================================
-->

<div id="map"></div>


<!--
============================================================
TITEL UND NAVIGATION
============================================================
-->

<div id="topbar">

  <div id="title">
    Neuseeland Pia a Gil
  </div>

  <a
    class="topbarButton"
    href="./planning.html"
  >
    📋 Reiseplanung
  </a>

  <a
    class="topbarButton"
    href="https://www.icloud.com/iclouddrive/00axAxKMb8ElGk_tsHClBTnoQ#2026_Neuseeland"
    target="_blank"
    rel="noopener noreferrer"
  >
    📁 Dokumenter
  </a>

</div>

<!--
============================================================
JAVASCRIPT-DATEIEN LADEN
============================================================

Leaflet:
  Bibliothek für die interaktive Karte

route.js:
  Reiseorte / Übernachtungsorte

campings.js:
  Campingplätze

activities.js:
  Wanderungen, Besichtigungen usw.
============================================================
-->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script src="./data/route.js"></script>

<script src="./data/campings.js"></script>

<script src="./data/activities.js"></script>

<script src="./data/accommodations.js"></script>

<script>
/*
 * ============================================================
 * 1. KARTE ERZEUGEN
 * ============================================================
 * Die Karte bekommt bereits eine Startposition.
 * Dadurch bleibt die OpenStreetMap-Karte sichtbar,
 * auch wenn später einmal eine Datendatei einen Fehler enthält.
 * ============================================================
 */

const map = L.map("map").setView(
  [-43.8, 171.2],
  6
);


/*
 * ============================================================
 * EBENEN
 * ============================================================
 *
 * Jede Gruppe kann später über das Ebenen-Menü
 * einzeln ein- oder ausgeschaltet werden.
 * ============================================================
 */

const routeLayer = L.layerGroup().addTo(map);

const tripStopLayer = L.layerGroup().addTo(map);

const campingLayer = L.layerGroup().addTo(map);

const activityLayer = L.layerGroup().addTo(map);

const accommodationLayer = L.layerGroup().addTo(map);


/*
 * ============================================================
 * 2. OPENSTREETMAP ALS HINTERGRUNDKARTE
 * ============================================================
 */

L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {
    maxZoom: 19,

    attribution:
      "&copy; OpenStreetMap contributors"
  }

).addTo(map);


/*
 * ============================================================
 * EBENEN-MENÜ
 * ============================================================
 */

const overlays = {

  "🚐 Route": routeLayer,

  "📍 Etappenorte": tripStopLayer,

  "⛺ Campingplätze": campingLayer,

  "🏠 Ënnerkonften": accommodationLayer,

  "★ Aktivitäten": activityLayer

};


L.control.layers(
  null,
  overlays,
  {
    collapsed: true
  }
).addTo(map);


/*
 * ============================================================
 * 3. REISEORTE / ÜBERNACHTUNGSORTE
 * ============================================================
 *
 * Die Daten kommen aus:
 *
 *     data/route.js
 *
 * Für jeden Eintrag in tripStops wird ein normaler
 * Leaflet-Marker erzeugt.
 *
 * Im Popup erscheinen:
 *
 * - Nummer der Etappe
 * - Ort
 * - Datum
 * - Anzahl der Nächte
 * - Camping
 * - Programm / Bemerkungen
 *
 * ============================================================
 */


tripStops.forEach((stop, index) => {


  /*
   * Popup für den Reiseort erzeugen
   */

  let popup = `

    <div style="
      font-size:16px;
      font-weight:bold;
      margin-bottom:6px;
    ">

      ${index + 1}. ${stop.name}

    </div>


    <div>

      ${stop.date}

      ${
        stop.nights > 0

        ? `
          <br>

          <b>
            ${stop.nights}
            Nuecht${stop.nights === 1 ? "" : "en"}
          </b>
        `

        : ""
      }

    </div>

  `;



  /*
   * Camping anzeigen,
   * falls in route.js vorhanden
   */

  if (stop.camping) {

    popup += `

      <div style="margin-top:10px;">

        <b>Camping</b>
        <br>

        ${stop.camping}

      </div>

    `;

  }



  /*
   * Programm / Bemerkungen anzeigen,
   * falls vorhanden
   */

  if (stop.notes) {

    popup += `

      <div style="margin-top:10px;">

        <b>Aktivitéiten</b>
        <br>

        ${stop.notes}

      </div>

    `;

  }



  /*
   * Marker auf die Karte setzen
   */

  L.marker(
    [stop.lat, stop.lon]
  )

  .addTo(tripStopLayer)

  .bindPopup(
    popup,
    {
      maxWidth: 350
    }
  );

});



/*
 * ============================================================
 * 4. CAMPINGPLÄTZE
 * ============================================================
 *
 * Die Campingdaten kommen aus:
 *
 *     data/campings.js
 *
 * Campingplätze erhalten einen grünen Marker
 * mit einem Zelt-Symbol.
 *
 * ============================================================
 */


/*
 * Eigenes Symbol für Campingplätze
 */

/*
 * Eigenes Symbol für Campingplätze
 *
 * Wenn der Campingplatz reserviert ist,
 * erscheint rechts oben zusätzlich ein grüner Haken.
 */

function createCampingIcon(camp) {


  /*
   * Prüfen, ob der Platz reserviert ist
   */

  const isReserved =
    camp.reservation &&
    camp.reservation.status === "reserviert";


  return L.divIcon({

    className: "",

    html: `

      <div style="
        position:relative;
        width:34px;
        height:34px;
      ">


        <!-- grüner Camping-Marker -->

        <div style="

          background:#238636;

          width:30px;
          height:30px;

          border-radius:50%;

          border:2px solid white;

          display:flex;

          align-items:center;
          justify-content:center;

          font-size:17px;

          box-shadow:
            0 1px 5px rgba(0,0,0,0.5);

        ">

          ⛺

        </div>


        ${
          isReserved

          ? `

            <!-- Haken für reservierte Plätze -->

            <div style="

              position:absolute;

              top:-6px;
              right:-6px;

              width:18px;
              height:18px;

              border-radius:50%;

              background:#20a83a;

              color:white;

              border:2px solid white;

              display:flex;

              align-items:center;
              justify-content:center;

              font-size:12px;

              font-weight:bold;

              box-shadow:
                0 1px 4px rgba(0,0,0,0.4);

            ">

              ✓

            </div>

          `

          : ""
        }


      </div>

    `,

    iconSize: [34, 34],

    iconAnchor: [17, 17],

    popupAnchor: [0, -17]

  });

}



/*
 * Alle Campingplätze auf die Karte setzen
 */

campings.forEach(camp => {


  /*
   * ----------------------------------------------------------
   * POPUP FÜR CAMPINGPLATZ
   * ----------------------------------------------------------
   */

  let popup = `

    <div style="
      font-size:16px;
      font-weight:bold;
      margin-bottom:6px;
    ">

      ⛺ ${camp.name}

    </div>


    <div>

      📅 ${camp.date}

    </div>


    <div style="margin-top:8px;">

      <b>Äusstattung</b>
      <br>

      ${camp.facilities}

    </div>

  `;


  /*
   * ----------------------------------------------------------
   * WOMO-REISEFÜHRER
   * ----------------------------------------------------------
   */

  if (camp.guideNumber || camp.guidePage) {

    popup += `

      <div style="
        margin-top:8px;
        padding-top:6px;
        border-top:1px solid #ccc;
      ">

        <b>📖 WoMo-Reiseführer</b>

    `;


    if (camp.guideNumber) {

      popup += `

        <br>
        Camping Nr. ${camp.guideNumber}

      `;

    }


    if (camp.guidePage) {

      popup += `

        <br>
        Seite ${camp.guidePage}

      `;

    }


    popup += `

      </div>

    `;

  }

/*
 * ----------------------------------------------------------
 * RESERVIERUNG
 * ----------------------------------------------------------
 */

if (camp.reservation) {


  /*
   * Status für die Anzeige vorbereiten
   */

  let statusText = camp.reservation.status;

  let statusIcon = "⚪";


  if (camp.reservation.status === "reserviert") {

    statusIcon = "✅";

    statusText = "Reserviert";

  }


  else if (
    camp.reservation.status ===
    "noch nicht reserviert"
  ) {

    statusIcon = "🟡";

    statusText = "Noch nicht reserviert";

  }


  else if (
    camp.reservation.status ===
    "Anfrage geschickt"
  ) {

    statusIcon = "📧";

    statusText = "Anfrage geschickt";

  }


  else if (
    camp.reservation.status ===
    "first come first served"
  ) {

    statusIcon = "🔵";

    statusText = "First come, first served";

  }



  /*
   * Reservierungsbereich beginnen
   */

  popup += `

    <div style="
      margin-top:9px;
      padding-top:7px;
      border-top:1px solid #ccc;
    ">

      <b>📅 Reservierung</b>

  `;



  /*
   * Status
   */

  if (camp.reservation.status) {

    popup += `

      <div style="margin-top:5px;">

        ${statusIcon}
        <b>${statusText}</b>

      </div>

    `;

  }



  /*
   * Platztyp
   */

  if (camp.reservation.siteType) {

    popup += `

      <div style="margin-top:4px;">

        <b>Platztyp:</b>
        ${camp.reservation.siteType}

      </div>

    `;

  }



  /*
   * Platznummer / Platzname
   */

  if (camp.reservation.siteName) {

    popup += `

      <div>

        <b>Platz:</b>
        ${camp.reservation.siteName}

      </div>

    `;

  }



  /*
   * Preis
   */

  if (camp.reservation.price) {

    popup += `

      <div>

        <b>Preis:</b>
        ${camp.reservation.price}

      </div>

    `;

  }



  /*
   * Buchungsnummer
   */

  if (camp.reservation.bookingNumber) {

    popup += `

      <div>

        <b>Buchungsnummer:</b>
        ${camp.reservation.bookingNumber}

      </div>

    `;

  }



  /*
   * Buchungsdatum
   */

  if (camp.reservation.bookedOn) {

    popup += `

      <div>

        <b>Gebucht am:</b>
        ${camp.reservation.bookedOn}

      </div>

    `;

  }



  /*
   * Bemerkung zur Reservierung
   */

  if (camp.reservation.note) {

    popup += `

      <div style="margin-top:5px;">

        ${camp.reservation.note}

      </div>

    `;

  }



  /*
   * Reservierungsbereich schließen
   */

  popup += `

    </div>

  `;

}

  /*
   * ----------------------------------------------------------
   * TELEFONNUMMER
   * ----------------------------------------------------------
   */

  if (camp.phone) {

    const phoneLink =
      camp.phone.replace(/\s/g, "");


    popup += `

      <div style="margin-top:8px;">

        ☎️

        <a href="tel:${phoneLink}">

          ${camp.phone}

        </a>

      </div>

    `;

  }



  /*
   * ----------------------------------------------------------
   * WEBSEITE
   * ----------------------------------------------------------
   */

  if (camp.url) {

    popup += `

      <div style="margin-top:6px;">

        🌐

        <a
          href="${camp.url}"
          target="_blank"
          rel="noopener noreferrer"
        >

          Websäit vum Camping

        </a>

      </div>

    `;

  }



  /*
   * ----------------------------------------------------------
   * CAMPERMATE
   * ----------------------------------------------------------
   */

  if (camp.camperMateUrl) {

    popup += `

      <div style="margin-top:6px;">

        📍

        <a
          href="${camp.camperMateUrl}"
          target="_blank"
          rel="noopener noreferrer"
        >

          Am CamperMate opmaachen

        </a>

      </div>

    `;

  }



  /*
   * ----------------------------------------------------------
   * BEMERKUNG
   * ----------------------------------------------------------
   */

  if (camp.note) {

    popup += `

      <div style="
        margin-top:8px;
        padding-top:6px;
        border-top:1px solid #ccc;
      ">

        <b>Remark</b>
        <br>

        ${camp.note}

      </div>

    `;

  }



  /*
   * ----------------------------------------------------------
   * CAMPING-MARKER ERZEUGEN
   * ----------------------------------------------------------
   */

  L.marker(

  [camp.lat, camp.lon],

  {
    icon: createCampingIcon(camp)
  }

)

  .addTo(campingLayer)

  .bindPopup(

    popup,

    {
      maxWidth: 320
    }

  );

});


/*
 * ============================================================
 * ËNNERKONFTEN
 * ============================================================
 *
 * D'Donnéeë kommen aus:
 *
 *     data/accommodations.js
 *
 * Fest Ënnerkonfte kréien e bloe Marker
 * mat engem Haus-Symbol.
 *
 * ============================================================
 */


/*
 * Eegent Symbol fir Ënnerkonften
 */

const accommodationIcon =
  L.divIcon({

    className: "",

    html: `

      <div style="

        background:#2563eb;

        width:30px;
        height:30px;

        border-radius:50%;

        border:2px solid white;

        display:flex;

        align-items:center;
        justify-content:center;

        font-size:17px;

        box-shadow:
          0 1px 5px rgba(0,0,0,0.5);

      ">

        🏠

      </div>

    `,

    iconSize: [30, 30],

    iconAnchor: [15, 15],

    popupAnchor: [0, -15]

  });



/*
 * All Ënnerkonften op d'Kaart setzen
 */

accommodations.forEach(accommodation => {


    let popup = `

    <div style="
      font-size:17px;
      font-weight:bold;
      margin-bottom:7px;
    ">

      🏠 ${accommodation.name}

    </div>


    <div>

      ${accommodation.place}

    </div>

  `;


  /*
   * ----------------------------------------------------------
   * EEN ODER MÉI OPENTHALTER
   * ----------------------------------------------------------
   */

  if (accommodation.stays) {

    accommodation.stays.forEach(stay => {

      popup += `

        <div style="
          margin-top:9px;
          padding-top:7px;
          border-top:1px solid #ccc;
        ">

          📅 ${stay.from} – ${stay.to}

          <br>

          🌙
          <b>
            ${stay.nights}
            Nuecht${stay.nights === 1 ? "" : "en"}
          </b>

      `;


      if (stay.note) {

        popup += `

          <div style="margin-top:5px;">
            ${stay.note}
          </div>

        `;

      }


      popup += `

        </div>

      `;

    });

  }


  /*
   * ----------------------------------------------------------
   * EEN EENZEGEN OPENTHALT
   * ----------------------------------------------------------
   */

  else {

    popup += `

      <div style="margin-top:7px;">

        📅 ${accommodation.from}
        –
        ${accommodation.to}

      </div>


      <div>

        🌙
        <b>
          ${accommodation.nights}
          Nuecht${accommodation.nights === 1 ? "" : "en"}
        </b>

      </div>

    `;


    if (accommodation.note) {

      popup += `

        <div style="
          margin-top:7px;
          padding-top:6px;
          border-top:1px solid #ccc;
        ">

          ${accommodation.note}

        </div>

      `;

    }

  }


  /*
   * Typ vun der Ënnerkonft
   */

  popup += `

    <div style="
      margin-top:9px;
      padding-top:7px;
      border-top:1px solid #ccc;
    ">

      <b>Typ:</b>
      ${accommodation.type}

    </div>

  `;


  L.marker(

    [accommodation.lat, accommodation.lon],

    {
      icon: accommodationIcon
    }

  )

  .addTo(accommodationLayer)

  .bindPopup(

    popup,

    {
      maxWidth: 320
    }

  );

});
  

/*
 * ============================================================
 * 5. AKTIVITÄTEN
 * ============================================================
 *
 * Die Daten kommen aus:
 *
 *     data/activities.js
 *
 * Aktivitäten erhalten einen
 * orangefarbenen Marker mit ★.
 *
 * ============================================================
 */


/*
 * Eigenes Symbol für Aktivitäten
 */

const activityIcon =
  L.divIcon({

    className: "",

    html: `

      <div style="

        background:#e67e22;

        width:30px;
        height:30px;

        border-radius:50%;

        border:2px solid white;

        display:flex;

        align-items:center;
        justify-content:center;

        font-size:18px;

        color:white;

        box-shadow:
          0 1px 5px rgba(0,0,0,0.5);

      ">

        ★

      </div>

    `,

    iconSize: [30, 30],

    iconAnchor: [15, 15],

    popupAnchor: [0, -15]

  });



/*
 * Alle Aktivitäten aus activities.js durchgehen
 */

activities.forEach(activity => {


  /*
   * Name der Aktivität
   */

  let popup = `

    <div style="
      font-size:17px;
      font-weight:bold;
      margin-bottom:7px;
    ">

      ★ ${activity.name}

    </div>

  `;



  /*
   * Ort
   */

  if (activity.place) {

    popup += `

      <div>
        ${activity.place}
      </div>

    `;

  }



  /*
   * Datum
   */

  if (activity.date) {

    popup += `

      <div>
        📅 ${activity.date}
      </div>

    `;

  }



  /*
   * Art der Aktivität
   */

  if (activity.type) {

    popup += `

      <div style="margin-top:7px;">

        <b>Aktivität:</b>
        ${activity.type}

      </div>

    `;

  }



  /*
   * Distanz
   */

  if (activity.distance) {

    popup += `

      <div>

        <b>Distanz:</b>
        ${activity.distance}

      </div>

    `;

  }



  /*
   * Dauer
   */

  if (activity.duration) {

    popup += `

      <div>

        <b>Dauer:</b>
        ${activity.duration}

      </div>

    `;

  }



  /*
   * ----------------------------------------------------------
   * REISEFÜHRER
   * ----------------------------------------------------------
   */

  if (activity.guidePage) {

    popup += `

      <div style="margin-top:7px;">

        📖 <b>WoMo-Reiseführer:</b>
        Seite ${activity.guidePage}

      </div>

    `;

  }



  /*
   * ----------------------------------------------------------
   * WEBSEITE DER AKTIVITÄT
   * ----------------------------------------------------------
   */

  if (activity.url) {

    popup += `

      <div style="margin-top:7px;">

        🌐

        <a
          href="${activity.url}"
          target="_blank"
          rel="noopener noreferrer"
        >

          Websäit vun der Aktivitéit

        </a>

      </div>

    `;

  }



  /*
   * ----------------------------------------------------------
   * Optionale Bemerkung
   * ----------------------------------------------------------
   */

  if (activity.note) {

    popup += `

      <div style="
        margin-top:7px;
        padding-top:6px;
        border-top:1px solid #ccc;
      ">

        ${activity.note}

      </div>

    `;

  }



  /*
   * Aktivitätsmarker erzeugen
   */

  L.marker(

    [activity.lat, activity.lon],

    {
      icon: activityIcon
    }

  )

  .addTo(activityLayer)

  .bindPopup(

    popup,

    {
      maxWidth: 320
    }

  );

});



/*
 * ============================================================
 * 6. STRASSENROUTE LADEN
 * ============================================================
 */

fetch("./data/roadroute.geojson")

  .then(response =>
    response.json()
  )

  .then(data => {



    /*
     * --------------------------------------------------------
     * Hilfsfunktion zur Darstellung einer Zeit
     * --------------------------------------------------------
     */

    function formatTime(minutes) {

      const hours =
        Math.floor(minutes / 60);

      const mins =
        minutes % 60;


      return (
        `${hours} h ` +
        `${String(mins).padStart(2, "0")} min`
      );

    }



    /*
     * --------------------------------------------------------
     * GeoJSON-Straßenroute erzeugen
     * --------------------------------------------------------
     */

    const roadRoute =
      L.geoJSON(

        data,

        {


          /*
           * Darstellung der Route
           */

          style: {

            weight: 5,

            opacity: 0.8

          },



          /*
           * Diese Funktion wird für jede einzelne
           * Reiseetappe ausgeführt.
           */

          onEachFeature:
            function(feature, layer) {


              const p =
                feature.properties;


              const distance =
                p.distance;



              /*
               * Fahrzeit bei durchschnittlich 50 km/h
               */

              const drivingMinutes =
                Math.round(
                  distance / 50 * 60
                );



              /*
               * 15 Minuten Pause pro Fahrstunde,
               * auf 15 Minuten aufgerundet.
               */

              const rawBreakMinutes =
                drivingMinutes / 4;


              const breakMinutes =
                Math.ceil(
                  rawBreakMinutes / 15
                ) * 15;



              /*
               * Gesamtzeit
               */

              const totalMinutes =
                drivingMinutes +
                breakMinutes;



              /*
               * ------------------------------------------------
               * POPUP FÜR DIE FAHRETAPPE
               * ------------------------------------------------
               */

              const popup = `


                <div style="
                  font-size:17px;
                  font-weight:bold;
                  margin-bottom:8px;
                ">

                  ${p.from} → ${p.to}

                </div>



                <div style="
                  margin-bottom:8px;
                  font-weight:bold;
                ">

                  Wéini? Den ${p.date}

                </div>



                <div style="
                  margin-bottom:8px;
                ">

                  ${p.fromCamping}
                  <br>

                  ↓
                  <br>

                  ${p.toCamping}

                </div>



                <div>

                  Distanz:
                  <b>${distance} km</b>

                </div>



                <div>

                  Dauer bei 50 km/h:
                  <b>
                    ${formatTime(drivingMinutes)}
                  </b>

                </div>



                <div>

                  Pausen (pro Stonn 15 min Paus):
                  <b>
                    ${formatTime(breakMinutes)}
                  </b>

                </div>



                <div style="
                  margin-top:6px;
                  padding-top:6px;
                  border-top:1px solid #aaa;
                ">

                  Total:
                  <b>
                    ${formatTime(totalMinutes)}
                  </b>

                </div>

              `;



              /*
               * Popup mit der Etappe verbinden
               */

              layer.bindPopup(

                popup,

                {
                  maxWidth: 350
                }

              );



              /*
               * Route beim Darüberfahren hervorheben
               */

              layer.on(

                "mouseover",

                function() {

                  this.setStyle({
                    weight: 9
                  });

                }

              );


              layer.on(

                "mouseout",

                function() {

                  this.setStyle({
                    weight: 5
                  });

                }

              );

            }

        }

      )

      .addTo(routeLayer);



    /*
     * ========================================================
     * KARTE AUTOMATISCH AUF DIE GESAMTE ROUTE ZOOMEN
     * ========================================================
     */

    map.fitBounds(

      roadRoute.getBounds(),

      {
        padding: [30, 30]
      }

    );

  })



  /*
   * ==========================================================
   * FEHLER BEIM LADEN DER ROUTE
   * ==========================================================
   */

  .catch(error => {

    console.error(

      "Fehler beim Laden der Straßenroute:",

      error

    );

  });


</script>


</body>

</html>
